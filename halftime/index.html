<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>EoD Halftime – Sponsor Display</title>
  <script type="text/javascript" src="/external/jquery/jquery.js"></script>
  <script type="text/javascript">
    // Compatibility shim: some environments/plugins call $.wdiget (typo).
    // Map it to $.widget when available, otherwise no-op to avoid runtime crash.
    (function () {
      if (!window.jQuery) return;
      const $ = window.jQuery;
      if (typeof $.wdiget !== 'function') {
        $.wdiget = (typeof $.widget === 'function') ? $.widget.bind($) : function () {};
      }
    })();
  </script>
  <script type="text/javascript" src="/json/core.js"></script>
  <link rel="stylesheet" href="index.css" />
  <script type="text/javascript" src="index.js"></script>
</head>
<body class="halftime-sponsor" sbContext="ScoreBoard.CurrentGame">

  <!-- ── Header ─────────────────────────────────────────────────────── -->
  <header class="HalftimeHeader">
    <span class="HalftimeLabel">HALFTIME</span>
  </header>

  <!-- ── Sponsor area ───────────────────────────────────────────────── -->
  <section class="SponsorArea">
    <p class="SponsorLabel">THANK YOU TO OUR SPONSORS</p>

    <!-- Single sponsor image that hard-cuts to next every 5s -->
    <div class="SponsorBox" id="SponsorBox">
      <img class="SponsorImg CurrentImg" />
      <!-- Hidden: CRG media binding source for sponsor banners -->
      <div id="Banners" hidden sbContext="/ScoreBoard.Media.Format(images).Type(sponsor_banner)">
        <div sbForeach="File:: name: resort=Name" sbAttr="src: Src"></div>
      </div>
    </div>

    <!-- Shown only when sponsor_banner/ folder is empty -->
    <div class="SponsorPlaceholder" id="sponsorPlaceholder">
      <span class="PlaceholderText">PROUDLY SUPPORTED BY OUR SPONSORS</span>
    </div>
  </section>

  <!-- ── Intermission clock footer ──────────────────────────────────── -->
  <footer class="ClockFooter">
    <div class="ClockBlock">
      <div class="ClockLabel">Intermission</div>
      <div class="ClockValue sbClock"
           id="intermissionClock"
           sbContext="Clock(Intermission)"
           sbDisplay="Time, Direction: sbToTime">—:——</div>
    </div>
  </footer>

</body>
</html>
